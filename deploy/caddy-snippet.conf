# AI 视频能力地图：加到线上 /etc/caddy/Caddyfile 的 `:8080 { }` 块里。
# 形态与 /stocks、/admin 完全一致（见 xiamimate-tools-backend/deploy/Caddyfile）。
#
# **顺序要紧**：必须排在主站的 `handle { ... }` 兜底之前，
# 否则 /atlas 的请求会全部落到主站静态页。
#
# 加完执行：
#   sudo caddy validate --config /etc/caddy/Caddyfile && sudo systemctl reload caddy

    # ── AI 视频能力地图 ───────────────────────────────────────────────
    # 纯静态，没有后端 —— 数据在构建时从 data/*.json 编进页面里。
    # handle_path 剥掉 /atlas 前缀；Next 那边配了 basePath: "/atlas"，
    # **两者是配套的一对**：HTML 里的资源链接带 /atlas，文件按根目录摆。
    @atlasRoot path /atlas
    redir @atlasRoot /atlas/ 308
    # ⚠️ 尾斜杠必须先重定向掉，**不能交给 try_files**。
    # Next 的静态导出产出的是 out/model/wan.html（文件），不是 out/model/wan/（目录）。
    # 于是 /atlas/model/wan/ 会依次试 {path}、{path}/、{path}.html 全落空，
    # 最后被兜底到 /index.html —— **返回 200，内容却是首页**。
    # 这是最阴的一种坏：不报错、不 404，就是给错东西。scripts/verify.mjs 第一次跑就是栽在这。
    # 308 到不带斜杠的规范地址，顺带把重复收录也解决了。
    @atlasTrail path_regexp trail ^/atlas/(.+)/$
    redir @atlasTrail /atlas/{re.trail.1} 308

    handle_path /atlas/* {
        root * /srv/xiamimate/atlas/current
        encode zstd gzip
        # ⚠️ **`{path}.html` 必须排在 `{path}/` 前面。** 2026-08-12 首次部署时栽在这：
        # `/atlas/text` 返回 404，可 `/atlas/text/tree` 是好的。
        # 原因是 out 里 `text.html`（文件）和 `text/`（目录，装着 tree.html 等子页）**同时存在**，
        # 而 `text/` 里没有 index.html —— try_files 先匹配上目录，file_server 进去找不到首页就 404，
        # `.html` 那一步**根本没轮到**。
        # 这也是 Next 静态导出的固有形状：每个有子路由的段都会同时产出同名 .html 和同名目录。
        try_files {path} {path}.html {path}/ /index.html
        file_server
    }
